server:
    port: 8080

spring:
    application:
        name: spring-modulith

    config:
        activate:
            on-profile: local

    datasource:
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:TESTING_DB;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        username: sa
        password:

    exposed:
        generate-ddl: true
        show-sql: true

    kafka:
        # kafka 서버 url
        bootstrap-servers: localhost:9092
        consumer:
            enable-auto-commit: false
