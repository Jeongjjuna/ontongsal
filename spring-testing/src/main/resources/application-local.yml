server:
    port: 8080

spring:
    application:
        name: testing

    config:
        activate:
            on-profile: local

    datasource:
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:TESTING_DB;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        username: sa
        password:

    h2:
        console:
            enabled: true
            path: /h2-console

    jpa:
        open-in-view: false
        show-sql: true
        hibernate:
            ddl-auto: create-drop
        properties:
            hibernate:
                format_sql: true

    data:
      redis:
          host: localhost
          port: 6379
          timeout: 2s

logging:
    level:
        yjh.ontongsal.testing: DEBUG
        org.springframework.web: DEBUG
#    pattern:
#        console: "%d{HH:mm:ss.SSS}|%highlight(%-5level)|%X{traceId:-}|%green(%t)|%logger|%blue(\\(%F:%L\\))|%msg%n"

springdoc:
    #  api-docs:
    #    enabled: false
    swagger-ui:
        url: /docs/openapi3.yaml
        path: /swagger-ui

jwt:
    issuer: spring-testing-server
    secret_key: ZmFrZS1zZWNyZXQta2V5LWZvci1kZW1vLXVzZS0xMjM0NTY3ODkwMTIz # 최소 32바이트 이상, Base64 인코딩값을 추천한다.

crypto:
    encrypt:
        password: test-password
        salt: 5c0744940b5c369b
