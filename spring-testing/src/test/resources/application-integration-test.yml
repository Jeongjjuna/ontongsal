spring:
    application:
        name: testing

    config:
        activate:
            on-profile: integration-test

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        # datasource 정보는 ApplicationContext 로드시 동적으로 주입

    data:
        redis:
        # redis 정보는 ApplicationContext 로드시 동적으로 주입

    h2:
        console:
            enabled: true
            path: /h2-console

    jpa:
        open-in-view: false
        show-sql: true
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                format_sql: true

logging:
    level:
        yjh.ontongsal.testing: DEBUG
        org.springframework.web: DEBUG
        org.testcontainers: DEBUG
#    pattern:
#        console: "%d{HH:mm:ss.SSS}|%highlight(%-5level)|%X{traceId:-}|%green(%t)|%logger|%blue(\\(%F:%L\\))|%msg%n"

springdoc:
    #  api-docs:
    #    enabled: false
    swagger-ui:
        url: /docs/openapi3.yaml
        path: /swagger-ui

jwt:
    issuer: spring-testing-server
    secret_key: ZmFrZS1zZWNyZXQta2V5LWZvci1kZW1vLXVzZS0xMjM0NTY3ODkwMTIz # 최소 32바이트 이상, Base64 인코딩값을 추천한다.

crypto:
    encrypt:
        password: test-password
        salt: 5c0744940b5c369b
