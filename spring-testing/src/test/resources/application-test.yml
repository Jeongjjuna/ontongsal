spring:
    application:
        name: testing

    config:
        activate:
            on-profile: test

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/TESTING_DB?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
        username: root
        password: rootpassword

    jpa:
        open-in-view: false
        show-sql: true
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                format_sql: true
logging:
    level:
        org.springframework.web: DEBUG
#    pattern:
#        console: "%d{HH:mm:ss.SSS}|%highlight(%-5level)|%X{traceId:-}|%green(%t)|%logger|%blue(\\(%F:%L\\))|%msg%n"

springdoc:
    #  api-docs:
    #    enabled: false
    swagger-ui:
        url: /docs/openapi3.yaml
        path: /swagger-ui

jwt:
    issuer: spring-testing-server
    secret_key: ZmFrZS1zZWNyZXQta2V5LWZvci1kZW1vLXVzZS0xMjM0NTY3ODkwMTIz # 최소 32바이트 이상, Base64 인코딩값을 추천한다.
